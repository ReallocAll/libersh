[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "libersh"
version = "0.1.0"
description = "Linux SSH, SFTP and durable remote jobs for trusted MCP agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp==4.1.6",
    "asyncssh==2.24.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2"]

[tool.setuptools]
packages = ["libersh"]
py-modules = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
